name: Build LocalForge and LocalForge Autopilot APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unpack uploaded source zip (if you uploaded one)
        run: if [ -f LocalForge-source.zip ]; then unzip -o -q LocalForge-source.zip; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch llama.cpp (pinned release b12025)
        run: git clone --depth 1 --branch b12025 https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleForgeRelease :app:assembleAutopilotRelease :app:testAutopilotReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build log when the build fails
        if: failure()
        shell: bash
        run: |
          grep -nE "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -150 > build-errors.txt || true
          tail -80 build.log >> build-errors.txt || true

      - name: Upload failure log as a release file
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/localforge-build' && 'build-log' || 'autopilot-build-log' }}
          name: Last failed build log (${{ github.ref_name }})
          body: Errors from the last failed build (${{ github.sha }}).
          files: build-errors.txt
          prerelease: true
          make_latest: false

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/forge/release/app-forge-release.apk LocalForge.apk
          cp app/build/outputs/apk/autopilot/release/app-autopilot-release.apk LocalForge-Autopilot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LocalForge-apks
          path: |
            LocalForge.apk
            LocalForge-Autopilot.apk

      # The main LocalForge download only changes from the localforge-build branch.
      - name: Publish LocalForge as "latest" release (easy phone download)
        if: github.ref == 'refs/heads/localforge-build'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LocalForge latest build
          body: Built from commit ${{ github.sha }}. Download LocalForge.apk below and open it on your phone.
          files: LocalForge.apk
          make_latest: true

      - name: Publish LocalForge Autopilot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autopilot-latest
          name: LocalForge Autopilot latest build
          body: |
            Built from ${{ github.ref_name }} at commit ${{ github.sha }}.
            LocalForge-Autopilot.apk is the 24/7 app. LocalForge.apk is the matching LocalForge update (shares its models with Autopilot).
          files: |
            LocalForge-Autopilot.apk
            LocalForge.apk
          prerelease: false
          make_latest: false
