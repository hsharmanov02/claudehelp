name: Test uncensored HF Spaces

# One job per Space, so each gets its own machine (Hugging Face's free GPU quota is per visitor).
on:
  push:
    paths:
      - "remote/try_space.py"
      - "remote/probe_docker.py"
      - ".github/workflows/test-spaces.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        space: ["hacktogone/uncensored-chat", "cereeenn120/CharacterChatBot"]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u remote/try_space.py "${{ matrix.space }}" /respond
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u remote/probe_docker.py https://akra35567-akira.hf.space https://fecuoy-fecuoy-ai-mistral-small-24b-instruct-2501-2bccc89.hf.space https://1egyb-ai-app.hf.space
