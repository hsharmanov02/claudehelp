name: Test uncensored HF Spaces

# One job per Space, so each gets its own machine (Hugging Face's free GPU quota is per visitor).
on:
  push:
    paths:
      - "remote/try_space.py"
      - ".github/workflows/test-spaces.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        space:
          - "kivilaid/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-ZeroGPU /respond 1"
          - "Josssdiff/Huihui-Qwen3.6-35B-abliterated-chat /chat"
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u remote/try_space.py ${{ matrix.space }}
