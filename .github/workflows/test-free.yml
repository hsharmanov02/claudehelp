name: Probe free LLM networks (no sign-up)

on:
  push:
    paths:
      - "remote/probe_free.py"
      - "remote/test_space.py"
      - ".github/workflows/test-free.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client
      - run: python3 -u remote/test_space.py
