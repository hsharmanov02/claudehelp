name: Forecast on tournament questions

on:
  workflow_dispatch:
  schedule:
    # Hourly keeps a private repo inside GitHub's 2,000 free Actions minutes a
    # month. On a public repo (minutes are free) "11,41 * * * *" runs every 30.
    - cron: "11 * * * *"

permissions:
  contents: write # to save the ledger to the node-data branch

concurrency:
  group: node-run
  cancel-in-progress: false

defaults:
  run:
    # The forecaster lives in its own folder; the rest of the repo is the PC node.
    working-directory: forecaster

jobs:
  forecast:
    # Repository variables (Settings > Secrets and variables > Actions > Variables).
    # Nothing runs, and no minutes are used, until NODE_PUBLISH is "true".
    # NODE_KILL=true stops it again. Dry runs are the "Test bot" workflow's job.
    if: vars.NODE_PUBLISH == 'true' && vars.NODE_KILL != 'true'
    runs-on: ubuntu-latest
    # The node stops itself after [guard].max_run_minutes (40), leaving time to
    # save the ledger.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - name: Load ledger
        run: scripts/load_ledger.sh
      - name: Run the node
        # exec, so a cancel or timeout signal reaches Python and it can record
        # what it spent before exiting.
        run: exec python -m node run metaculus --publish
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          NODE_PUBLISH: ${{ vars.NODE_PUBLISH }}
          NODE_KILL: ${{ vars.NODE_KILL }}
      - name: Save ledger
        if: always()
        run: scripts/save_ledger.sh
