name: Forecast on tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *" # every 30 minutes

permissions:
  contents: write # to save the ledger to the node-data branch

concurrency:
  group: node-run
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Load ledger
        run: scripts/load_ledger.sh
      - name: Run the node
        run: python -m node run metaculus --publish
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          # Repository variables (Settings > Secrets and variables > Actions > Variables).
          # NODE_PUBLISH=true turns on real forecasts; NODE_KILL=true stops the node.
          NODE_PUBLISH: ${{ vars.NODE_PUBLISH }}
          NODE_KILL: ${{ vars.NODE_KILL }}
      - name: Status
        if: always()
        run: python -m node status
      - name: Save ledger
        if: always()
        run: scripts/save_ledger.sh
