name: Benchmark variants

on:
  workflow_dispatch:
    inputs:
      questions:
        description: "Open questions to benchmark on"
        default: "10"
      budget_usd:
        description: "Total model spend for all variants, in dollars (also limited by the monthly cap)"
        default: "20"

permissions:
  contents: write

concurrency:
  group: node-run
  cancel-in-progress: false

jobs:
  benchmark:
    if: vars.NODE_KILL != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Load ledger
        run: scripts/load_ledger.sh
      - name: Benchmark
        run: >-
          exec python -m node.improve.benchmark
          --questions "${{ inputs.questions }}"
          --budget-usd "${{ inputs.budget_usd }}"
          --minutes 100
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          NODE_KILL: ${{ vars.NODE_KILL }}
      - name: Save ledger
        if: always()
        run: scripts/save_ledger.sh
