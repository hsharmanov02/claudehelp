name: Deploy Modal engine

# Puts your own uncensored model on a Modal GPU for the LocalForge apps (see remote/modal_engine.py).
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   MODAL_TOKEN_ID, MODAL_TOKEN_SECRET  from modal.com > Settings > API Tokens
#   LOCALFORGE_KEY                      a password you make up; you type it into the app too
on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "GPU (L4 = 24 GB, T4 = 16 GB and cheapest, L40S = 48 GB, A100-80GB)"
        default: "L4"
        type: choice
        options: [L4, T4, A10, L40S, A100-80GB]
      model_repo:
        description: "Hugging Face GGUF repo (must be abliterated / uncensored)"
        default: "bartowski/huihui-ai_Qwen3-14B-abliterated-GGUF"
      quant:
        description: "Quantization"
        default: "Q4_K_M"
      ctx:
        description: "Context size in tokens"
        default: "16384"
      scaledown:
        description: "Seconds the GPU stays awake after the last message"
        default: "120"

permissions:
  contents: read

concurrency: deploy-modal

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      LF_GPU: ${{ inputs.gpu }}
      LF_MODEL_REPO: ${{ inputs.model_repo }}
      LF_QUANT: ${{ inputs.quant }}
      LF_CTX: ${{ inputs.ctx }}
      LF_SCALEDOWN: ${{ inputs.scaledown }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        env:
          LOCALFORGE_KEY: ${{ secrets.LOCALFORGE_KEY }}
        run: |
          missing=""
          [ -n "$MODAL_TOKEN_ID" ] || missing="$missing MODAL_TOKEN_ID"
          [ -n "$MODAL_TOKEN_SECRET" ] || missing="$missing MODAL_TOKEN_SECRET"
          [ -n "$LOCALFORGE_KEY" ] || missing="$missing LOCALFORGE_KEY"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Modal CLI
        run: pip install -q modal

      - name: Save your key in Modal
        env:
          LOCALFORGE_KEY: ${{ secrets.LOCALFORGE_KEY }}
        run: modal secret create localforge-key "LOCALFORGE_KEY=$LOCALFORGE_KEY" --force > /dev/null && echo "Key saved."

      - name: Download the model into Modal (CPU, a few minutes the first time)
        run: modal run remote/modal_engine.py::download

      - name: Deploy the engine
        run: |
          # This repo is public: the address stays out of the log, so strangers can't wake (and bill) your GPU.
          modal deploy remote/modal_engine.py > deploy.log 2>&1 || { sed -E 's#https://[^ ]+modal\.run#https://(hidden)#g' deploy.log; exit 1; }
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.modal\.run' deploy.log | head -1)
          echo "::add-mask::$URL"
          sed -E 's#https://[^ ]+modal\.run#https://(hidden)#g' deploy.log
          echo "URL=$URL" >> "$GITHUB_ENV"

      - name: Wake it and check it (GPU start-up takes a minute or two)
        env:
          LOCALFORGE_KEY: ${{ secrets.LOCALFORGE_KEY }}
        run: |
          [ -n "$URL" ] || { echo "::error::Couldn't find the address in the deploy output."; exit 1; }
          python3 remote/test_engine.py "$URL" "$LOCALFORGE_KEY"

      - name: Where to find your address
        if: always()
        run: |
          {
            echo "### LocalForge remote engine"
            echo ""
            echo "Your address is hidden here because this repo is public. Open modal.com > Apps > **localforge-engine** >"
            echo "**serve** and copy the URL ending in \`.modal.run\`. Paste it into **Remote GPU engine** in the app with your key."
          } >> "$GITHUB_STEP_SUMMARY"
