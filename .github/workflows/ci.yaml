name: Tests

on:
  push:
    branches: [main]
    paths: ["forecaster/**", ".github/**"]
  pull_request:
    paths: ["forecaster/**", ".github/**"]

defaults:
  run:
    # The forecaster lives in its own folder; the rest of the repo is the PC node.
    working-directory: forecaster

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: python -m pytest -q
