[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-buyer-node"
version = "0.1.0"
description = "An autonomous node that earns from protocol buyers: programs with published rules that pay for work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "forecasting-tools==0.3.1",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
node = "node.cli:main"

[tool.setuptools.packages.find]
include = ["node*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
